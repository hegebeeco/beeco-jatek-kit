<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>beeco 3D világ</title>
  <meta name="theme-color" content="#FECF39">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/ikon-32.png">
  <!--
    ÉLŐ HÁTTÉR-BEMUTATÓ: a web/js/vilag/ modul (beecoVilag) minden kapcsolóval – minőség (B/C/automatikus),
    sziget, rét, napszak. Leírás és beépítés: docs/3d-vilag.md.
  -->
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/ds.css">
  <link rel="stylesheet" href="css/ds-game.css">
  <style>
    /* csak a bemutató elrendezése – tokenekkel */
    *{ box-sizing:border-box; }
    html, body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--body); }
    #view{ position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; cursor:grab; }
    .panel{ position:fixed; left:var(--sp-3); top:var(--sp-3); width:min(330px, calc(100vw - 2 * var(--sp-3))); padding:var(--sp-3) var(--sp-4);
      display:grid; gap:var(--sp-2); z-index:var(--z-hud); max-height:calc(100vh - 2 * var(--sp-3)); overflow:auto; }
    .panel h1{ font:400 var(--fs-xl)/1 var(--display); margin:0; }
    .opt{ display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2); min-height:var(--tap); }
    .opt > span{ font-weight:700; font-size:var(--fs-s); }
    .stats{ position:fixed; right:var(--sp-3); top:var(--sp-3); display:flex; gap:var(--sp-2); z-index:var(--z-hud); }
    .body{ display:grid; gap:var(--sp-2); }
    .panel.is-closed .body{ display:none; }
    .head{ display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2); }
    @media (max-width:600px){
      .panel{ top:auto; bottom:var(--sp-3); }
      .stats{ left:var(--sp-3); right:auto; }
    }
  </style>
</head>
<body class="ds-page">
<canvas id="view" aria-label="A beeco 3D világ – húzással forgatható, görgővel közelíthető"></canvas>
<div class="stats" id="stats" aria-live="polite"></div>
<section class="panel ds-card" id="panel" aria-label="Beállítások">
  <div class="head"><h1>3D világ</h1><button class="ds-icon-btn" id="fold" type="button" aria-expanded="true" aria-label="Beállítások elrejtése"></button></div>
  <div class="body">
    <p class="ds-muted" style="margin:0">Egy hívás: ég, felhők, lebegő szigetek és füves talaj bármelyik játékhoz.</p>
    <div class="opt"><span>Minőség</span><div class="ds-seg" role="radiogroup" aria-label="Minőség" id="q">
      <button type="button" role="radio" data-v="auto">Auto</button><button type="button" role="radio" data-v="B">B</button><button type="button" role="radio" data-v="C">C</button></div></div>
    <div class="opt"><span>Napszak</span><div class="ds-seg" role="radiogroup" aria-label="Napszak" id="t">
      <button type="button" role="radio" data-v="nap">Nap</button><button type="button" role="radio" data-v="alkony">Alkony</button><button type="button" role="radio" data-v="este">Este</button></div></div>
    <div class="opt"><span>Méhsejt-sziget</span><button class="ds-switch" type="button" role="switch" id="island" aria-label="Méhsejt-sziget"></button></div>
    <div class="opt"><span>Virágos rét</span><button class="ds-switch" type="button" role="switch" id="meadow" aria-label="Virágos rét"></button></div>
    <div class="opt"><span>Tárgyak a kertben</span><button class="ds-switch" type="button" role="switch" id="props" aria-label="Tárgyak a kertben"></button></div>
    <details class="ds-details"><summary>Így hívd meg</summary><pre id="call" style="white-space:pre-wrap;font:600 12px/1.45 ui-monospace,Menlo,monospace;margin:0 0 var(--sp-2)"></pre></details>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/ds.js"></script>
<script src="js/art/art.js"></script>
<script src="js/art/model-kit.js"></script>
<script src="js/3d/szelektalj-modellek.js"></script>
<script src="js/vilag/vilag-modellek.js"></script>
<script src="js/vilag/vilag-fold.js"></script>
<script src="js/vilag/vilag.js"></script>
<script src="js/3d/orbit.js"></script>
<script src="js/pics.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const canvas = $('#view'), renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(55, 1, 0.1, 400);
  const orb = beecoOrbit(THREE, camera, canvas, { target:[0, 1.5, 0], dist:30, az:30, el:16, maxDist:42, minDist:4, speed:4 });

  // a bemutató állapota (a kapcsolók) – sziget/rét váltásnál a világ újraépül (dispose + új hívás)
  const st = { quality:'auto', time:'nap', island:true, meadow:true, props:true };
  let V = null, props = null;
  function build(){
    if(V) V.dispose();
    V = beecoVilag(THREE, scene, { quality:st.quality, time:st.time, island:st.island, meadow:st.meadow && { inner:7 }, onQuality:() => ui() });
    if(!props){ props = new THREE.Group(); const put = (m, x, z, ry) => { const g = V.model3(m, true); g.position.set(x, 0, z); g.rotation.y = ry || 0; props.add(g); };
      put(SZ_MODELS.bed(MODEL), 0, 0); put(SZ_MODELS.bin(MODEL, 'papir', MODEL.hexOf('blue:1')), -4, 3, 2.6);
      put(SZ_MODELS.bin(MODEL, 'uveg', MODEL.hexOf('leaf:1')), 4, 3, -2.6); put(SZ_MODELS.bin(MODEL, 'olaj', MODEL.hexOf('orange:1')), 0, -4.5, 0);
      scene.add(props); }
    props.visible = st.props; ui();
  }
  function ui(){
    for(const [id, v] of [['q', V.auto ? 'auto' : st.quality === 'auto' ? V.quality : st.quality], ['t', st.time]])
      $('#' + id).querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', b.dataset.v === v));
    for(const k of ['island', 'meadow', 'props']) $('#' + k).setAttribute('aria-checked', st[k]);
    const o = [st.island && 'island:true', st.meadow && 'meadow:{ inner:7 }', st.quality !== 'auto' && `quality:'${st.quality}'`, st.time !== 'nap' && `time:'${st.time}'`].filter(Boolean);
    $('#call').textContent = `const V = beecoVilag(THREE, scene, { ${o.join(', ')} });\n// képkockánként:\nV.tick(dt, camera);`;
  }
  $('#q').onclick = e => { const v = e.target.dataset.v; if(!v) return; st.quality = v; if(v === 'auto') build(); else { V.setQuality(v); build(); } };
  $('#t').onclick = e => { const v = e.target.dataset.v; if(!v) return; st.time = v; V.setTime(v); ui(); };
  for(const k of ['island', 'meadow']) $('#' + k).onclick = () => { st[k] = !st[k]; build(); };
  $('#props').onclick = () => { st.props = !st.props; props.visible = st.props; ui(); };
  $('#fold').innerHTML = pic('menu');
  $('#fold').onclick = () => { const c = $('#panel').classList.toggle('is-closed'); $('#fold').setAttribute('aria-expanded', !c); $('#fold').setAttribute('aria-label', c ? 'Beállítások megnyitása' : 'Beállítások elrejtése'); };
  if(innerWidth < 600) $('#fold').click();                                   // telefonon a panel alapból csukva, hogy a világ látsszon

  function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    camera.fov = camera.aspect < 1 ? 72 : 55; camera.updateProjectionMatrix(); orb.set({ dist:camera.aspect < 1 ? 38 : 30 }); }   // álló kijelzőn tágabb látószög, hogy a sziget kiférjen
  addEventListener('resize', resize); resize();
  build();
  // képkocka-ciklus + kép/mp kijelzés (félmásodpercenként)
  let last = performance.now(), fAcc = 0, fN = 0;
  (function loop(now){ requestAnimationFrame(loop); const dt = Math.min((now - last) / 1000, 0.1); last = now;
    orb.update(dt); V.tick(dt, camera); renderer.render(scene, camera);
    fAcc += dt; fN++; if(fAcc > 0.5){ const i = renderer.info.render;
      $('#stats').innerHTML = `<span class="ds-chip is-small is-honey">${Math.round(fN / fAcc)} kép/mp</span><span class="ds-chip is-small">${i.calls} hívás</span><span class="ds-chip is-small">${V.quality} szint</span>`;
      fAcc = 0; fN = 0; } })(last);
  window.VILAG_DEMO = { get V(){ return V; }, st, build, orb };                 // a képernyőképes ellenőrzéshez (tools/jatek-foto.js)
})();
</script>
</body>
</html>
